<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記憶方塊 (Memory Blocks)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <h1>記憶方塊</h1>
        <div id="level-display">關卡: <span id="level">1</span></div>
        <div id="score-display">分數: <span id="score">0</span></div>
        <div id="grid">
            <!-- 方塊將由JavaScript動態生成 -->
        </div>
        <button id="start">開始遊戲</button>
    </div>
    
    <div id="game-over" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>遊戲結束！</h2>
            <p>最終分數: <span id="final-score"></span></p>
            <button id="replay">再玩一次</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
